name: status-checks
# Scheduled uptime checks for the Hepherus status/alert page (D-2208). Runs check.py (writes checks.json),
# then alert.py (emails Maestro via Resend on 2 consecutive failures / on recovery, state in alert_state.json),
# then commits any change. GitHub's schedule is best-effort and may lag several minutes (an accepted limit of
# the no-paid-service choice). Secrets are read from GitHub Actions secrets — nothing is committed to the repo.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: status-checks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Run checks
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: python3 check.py
      - name: Evaluate alerts (email on 2 consecutive failures / recovery)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: python3 alert.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- checks.json alert_state.json; then
            git config user.name "hepherus-status-bot"
            git config user.email "status-bot@users.noreply.github.com"
            git add checks.json alert_state.json
            git commit -m "status: update checks.json / alert_state.json"
            git push
          else
            echo "no change"
          fi
